<div class="question-block">
  <p class="question">{{ question.question }}</p>
  <div class="input">
    <div class="button">
      <label for="bool" class="bool-container moody">False
        <input type="checkbox" id="bool" name="bool" value=True checked="checked" mandatory=question.mandatory />
        <span class="bool-checkmark">True</span>
      </label>
    </div>
    {% if question.mandatory %}
    <p class="mandatory">(mandatory)</p>
    {% endif %}
  </div>
</div>
